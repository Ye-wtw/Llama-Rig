name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows portable exe
    runs-on: windows-latest

    # 兜底：显式指定官方镜像，不走任何区域镜像。
    # runner 在国外，若照仓库里的 .npmrc 去国内镜像拉 142MB 的 Electron 包，
    # 会出现「zip: not a valid zip file」这类下载损坏（v0.8.1 构建就挂在这）。
    env:
      ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
      ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release version contract
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:RELEASE_TAG
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tag must use strict semver vX.Y.Z; received $tag"
          }

          $package = Get-Content -Raw -LiteralPath package.json | ConvertFrom-Json
          $expectedTag = "v$($package.version)"
          if ($tag -ne $expectedTag) {
            throw "Release tag $tag does not match package.json version $($package.version)"
          }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build portable exe
        run: npm run dist

      - name: Generate checksum
        shell: pwsh
        run: |
          # 产物名从 package.json 派生，与 electron-builder.yml 的
          # artifactName: Llama-Rig-${version}.${ext} 保持同一个 source of truth。
          $package = Get-Content -Raw -LiteralPath package.json | ConvertFrom-Json
          $exeName = "Llama-Rig-$($package.version).exe"
          $exe = "dist/$exeName"
          if (-not (Test-Path -LiteralPath $exe)) {
            throw "Portable artifact not found: $exe"
          }
          $hash = Get-FileHash -LiteralPath $exe -Algorithm SHA256
          "$($hash.Hash)  $exeName" | Set-Content -LiteralPath "$exe.sha256" -Encoding ascii

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          name: Llama Rig ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## Assets
            - `Llama-Rig-<version>.exe` —— 免安装便携版（版本号与 tag 一致，取自 package.json）
            - 同名 `.sha256` 校验文件

            ## 首次运行会看到 SmartScreen 提示（正常现象，不是病毒）

            本程序**没有购买代码签名证书**，所以 Windows Defender SmartScreen 会提示
            「Windows 已保护你的电脑 / 阻止了无法识别的应用」。

            这是未签名程序的统一待遇，与程序内容无关。请这样继续：

            1. 点提示框里的 **「更多信息」**
            2. 再点右下角的 **「仍要运行」**

            想确认文件没被篡改，可以先核对校验和（下载后按下面的方式算，与 `.sha256` 比对）：

            ```powershell
            Get-FileHash .\Llama-Rig-<version>.exe -Algorithm SHA256
            ```

            ## 数据放在哪

            完全便携：所有数据生成在 **exe 所在的文件夹**，不写 `%APPDATA%`、不写注册表。
            首次运行后 exe 旁边会出现：

            - `configs\` —— 预设目录（首次运行会放入一个示例预设「示例-通用参数」）
            - `userdata\` —— 界面缓存，可随时删除
            - `config.toml` / `desktop-state.json` —— 保存设置后生成

            预设就是你自己的文件：备份或换机器时，把 `configs\` 整个拷过去即可。

            ## Known limitations
            - Windows portable executable only. llama.cpp binaries, models, mmproj files, CUDA, and Vulkan are not bundled.
            - 未做代码签名，首次运行需要手动通过 SmartScreen 提示。

            ## Configuration migration
            - Existing user configuration, history, and runtime state are preserved. No migration is required.
          files: |
            dist/Llama-Rig-*.exe
            dist/Llama-Rig-*.exe.sha256
