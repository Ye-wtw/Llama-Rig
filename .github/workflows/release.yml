name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows portable exe
    runs-on: windows-latest

    # 兜底：显式指定官方镜像，不走任何区域镜像。
    # runner 在国外，若照仓库里的 .npmrc 去国内镜像拉 142MB 的 Electron 包，
    # 会出现「zip: not a valid zip file」这类下载损坏（v0.8.1 构建就挂在这）。
    env:
      ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
      ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release version contract
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:RELEASE_TAG
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tag must use strict semver vX.Y.Z; received $tag"
          }

          $package = Get-Content -Raw -LiteralPath package.json | ConvertFrom-Json
          $expectedTag = "v$($package.version)"
          if ($tag -ne $expectedTag) {
            throw "Release tag $tag does not match package.json version $($package.version)"
          }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build release artifacts
        run: npm run dist

      - name: Generate checksums
        shell: pwsh
        run: |
          # 产物名从 package.json 派生，与 electron-builder.yml 的
          # artifactName: Llama-Rig-${version}.${ext} 保持同一个 source of truth。
          # 两种形态都要校验和：便携版 exe 与解压版 zip。
          # 少一个都会让用户下载后无法核对，所以缺任何一个都直接失败。
          $package = Get-Content -Raw -LiteralPath package.json | ConvertFrom-Json
          $version = $package.version
          foreach ($ext in @('exe', 'zip')) {
            $name = "Llama-Rig-$version.$ext"
            $path = "dist/$name"
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Release artifact not found: $path"
            }
            $hash = Get-FileHash -LiteralPath $path -Algorithm SHA256
            "$($hash.Hash)  $name" | Set-Content -LiteralPath "$path.sha256" -Encoding ascii
            Write-Host "checksum: $name -> $($hash.Hash)"
          }

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          name: Llama Rig ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## 两种下载，选一个

            | 文件 | 适合谁 |
            | --- | --- |
            | `Llama-Rig-<version>.zip` | **解压版（推荐）**：解压到任意有空间的目录，双击里面的 `Llama Rig.exe` 即可。全程不碰系统临时目录 |
            | `Llama-Rig-<version>.exe` | 便携单文件版：下载即双击。首次运行会把内容解到系统临时目录（约 430 MB，在 C 盘） |

            两个文件内容完全相同，只是分发形态不同。各自附有同名 `.sha256` 校验文件。

            > **C 盘空间紧张就选解压版。** 便携版需要往 `%TEMP%` 写约 430 MB，
            > C 盘不够时会报 `NSIS Error: Error writing temporary file`，
            > 这个提示不会告诉你是磁盘满了。解压版没有这个问题。

            ## 首次运行会看到 SmartScreen 提示（正常现象，不是病毒）

            本程序**没有购买代码签名证书**，所以 Windows Defender SmartScreen 会提示
            「Windows 已保护你的电脑 / 阻止了无法识别的应用」。

            这是未签名程序的统一待遇，与程序内容无关。请这样继续：

            1. 点提示框里的 **「更多信息」**
            2. 再点右下角的 **「仍要运行」**

            想确认文件没被篡改，可以先核对校验和（下载后按下面的方式算，与 `.sha256` 比对）：

            ```powershell
            Get-FileHash .\Llama-Rig-<version>.exe -Algorithm SHA256
            ```

            ## 数据放在哪

            数据和程序放在一起：所有数据生成在 **程序所在文件夹**，不写 `%APPDATA%`、不写注册表。

            - 解压版：就是你解压出来的那个文件夹
            - 便携版：就是你放 exe 的那个文件夹

            首次运行后旁边会出现：

            - `configs\` —— 预设目录（首次运行会放入一个示例预设「示例-通用参数」）
            - `userdata\` —— 界面缓存，可随时删除
            - `config.toml` / `desktop-state.json` —— 保存设置后生成

            预设就是你自己的文件：备份或换机器时，把 `configs\` 整个拷过去即可。

            ## Known limitations
            - Windows only. llama.cpp binaries, models, mmproj files, CUDA, and Vulkan are not bundled.
            - 未做代码签名，首次运行需要手动通过 SmartScreen 提示。
            - 便携版首次运行需要系统临时目录有约 430 MB 可用空间（C 盘紧张请改用解压版）。

            ## Configuration migration
            - Existing user configuration, history, and runtime state are preserved. No migration is required.
          files: |
            dist/Llama-Rig-*.exe
            dist/Llama-Rig-*.exe.sha256
            dist/Llama-Rig-*.zip
            dist/Llama-Rig-*.zip.sha256
